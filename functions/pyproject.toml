[project]
name = "functions"
version = "0.1.0"
description = "Lambda functions for care-graphRAG"
requires-python = "==3.11.*"
dependencies = [
    "pymongo[srv]==4.6.1",
    "mangum==0.17.0",
    "fastapi==0.104.1",
    "python-dotenv==1.0.0",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.5.2",
    "boto3>=1.35.0",
    "openai>=1.86.0,<2.0.0",
    "requests==2.31.0",
    "langchain==0.3.26",
    "langchain-openai==0.3.28",
    "langchain-mongodb==0.6.2",
    "tenacity==8.2.3",
    "certifi>=2023.0.0",
    "aws-xray-sdk==2.14.0",
    "numpy>=1.26.4,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["handlers", "graphrag", "middleware"]